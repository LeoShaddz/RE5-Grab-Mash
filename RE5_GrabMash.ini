[Main]
Enable=1
; ---- KEYBOARD (ExtraKeyVK) ----
; interval (ms) between keys (A <-> D). 60 = same speed as the controller (PadPeriodMs).
; Lower = faster, higher = slower.
KeyPeriodMs=60
; ---- CONTROLLER (hold A) ----
; interval (ms) between left and right of the simulated analog (this was the value from the working version).
PadPeriodMs=60
; time (ms) for a full circle of the simulated analog during ROTATE prompts. Lower = rotates faster.
PadRotatePeriodMs=700
; strength of the simulated analog (0..32767)
Amplitude=30000
; ---- GENERAL ----
; after the prompt disappears, continues simulating for this many more ms while you hold it (fixes rotation stopping
; slightly before the end). 0 = disabled.
GraceMs=700
; -1 = any player; 0 = player 0 only (use if the prompt also appears for the partner)
PlayerId=-1
; maximum time (ms) a prompt counts as active
MaxPromptMs=10000
; optional: virtual-key code of a keyboard key (0 = disabled). Example: 69 = E, 70 = F.
; NO controller needed: holding the key during an analog prompt makes the mod press A and D
; alternately (W and S on up/down prompts), like in the original game, without touching controller
; input (the game continues showing keyboard icons).
; Do not use A, D, W, or S here (use another key, e.g., 70 = F).
ExtraKeyVK=70
; simulated keys (virtual-key codes): 65=A 68=D 87=W 83=S. Change if you remapped the game controls.
KeyLeftVK=65
KeyRightVK=68
KeyUpVK=87
KeyDownVK=83
; 1 = write RE5_GrabMash.log in the .asi folder
Log=0